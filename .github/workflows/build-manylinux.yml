name: AutoBangumi｜Manylinux 构建（备用）

on:
  workflow_dispatch:
    inputs:
      version:
        description: 上游版本，留空自动获取最新版
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: autobangumi-${{ inputs.version || 'latest' }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      should_build: ${{ steps.resolve.outputs.should_build }}
    steps:
      - id: resolve
        env:
          REQUESTED: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${REQUESTED}"
          [ -n "${version}" ] || version="$(gh api repos/EstrellaXD/Auto_Bangumi/releases/latest --jq '.tag_name | ltrimstr("v")')"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          tag="autobangumi-v${version}"
          if [ "${GITHUB_EVENT_NAME}" = schedule ] && gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "should_build=false" >> "${GITHUB_OUTPUT}"
          else
            echo "should_build=true" >> "${GITHUB_OUTPUT}"
          fi

  build:
    needs: resolve
    if: needs.resolve.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: armv8
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: 构建 DSM 7.1 兼容套件
        run: bash scripts/build_autobangumi.sh "${{ needs.resolve.outputs.version }}" "${{ matrix.arch }}"
      - name: 保存备用构建 SPK
        uses: actions/upload-artifact@v5
        with:
          name: autobangumi-manylinux-${{ matrix.arch }}-DSM7.1
          path: dist/${{ matrix.arch }}/*.spk
          if-no-files-found: error
